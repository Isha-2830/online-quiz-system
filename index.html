<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programming Quiz Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Programming Quiz Hub</h1>
    <p>Learn, Practice and Test Your Coding Knowledge</p>
</header>

<main class="container">

    <section id="language-screen">
        <h2>Choose Your Programming Language</h2>
        <p>Select a language to explore its quiz sets.</p>

        <div id="language-list" class="grid">
            <button class="language-card" data-language="Python">🐍 Python</button>
            <button class="language-card" data-language="Java">☕ Java</button>
            <button class="language-card" data-language="C">💻 C</button>
            <button class="language-card" data-language="C++">⚙️ C++</button>
            <button class="language-card" data-language="HTML">🌐 HTML</button>
            <button class="language-card" data-language="JavaScript">🟨 JavaScript</button>
        </div>
    </section>

    <section id="sets-screen" class="hidden">
        <button id="back-languages" class="secondary">← Back to Languages</button>
        <h2 id="selected-language"></h2>
        <p>Choose a quiz set. Each set contains 10 questions.</p>
        <div id="set-list" class="grid"></div>
    </section>

    <section id="quiz-screen" class="hidden">
        <div class="quiz-info">
            <span id="question-number"></span>
            <span id="timer">Time: 120 seconds</span>
        </div>

        <div class="progress-track">
            <div id="progress-bar"></div>
        </div>

        <h2 id="question"></h2>
        <div id="options"></div>
        <p id="feedback"></p>

        <button id="next-btn" class="hidden">Next Question</button>
    </section>

    <section id="result-screen" class="hidden">
        <h2>Quiz Completed!</h2>
        <h3 id="score"></h3>
        <p id="result-message"></p>
        <button id="retry-btn">Retry This Set</button>
        <button id="choose-set-btn" class="secondary">Choose Another Set</button>
        <button id="choose-language-btn" class="secondary">Choose Another Language</button>
    </section>

</main>

<footer>
    <p>Programming Quiz Hub | Practice Every Day</p>
</footer>

<script src="./script.js" defer></script>
</body>
</html>
